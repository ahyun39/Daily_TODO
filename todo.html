<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; font-src 'self';">
<meta name="referrer" content="no-referrer">
<title>오늘 할 일을 내일로 미루지 말자</title>
<style>
/* =============================================
   색상 변수 — 여기만 수정하면 전체 색상 변경
   ============================================= */
:root {
  --bg:    #F8F5F0;  /* 전체 배경 (종이)       */
  --panel: #EEE8DF;  /* 캘린더 패널 (노트 탭)  */
  --dark:  #3D3830;  /* 잉크 (텍스트·강조)     */
  --mid:   #C4BAB0;  /* 연필선 (테두리·보조)   */
}
/* 파생 색상 (자동 계산 — 수정 불필요) */
:root {
  --mid-hover: color-mix(in srgb, var(--mid) 40%, white);
  --mid-deep:  color-mix(in srgb, var(--mid) 80%, black 10%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', 'Times New Roman', serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; }

/* Header */
header { padding: 0 28px; height: 50px; background: var(--bg); border-bottom: 1px solid var(--mid); display: flex; justify-content: space-between; align-items: center; }
header h1 { font-size: 14px; font-weight: normal; color: var(--dark); letter-spacing: 1.5px; text-transform: uppercase; }
.btn { padding: 5px 14px; border: 1px solid var(--mid); background: transparent; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit; color: var(--dark); transition: background .12s; }
.btn:hover { background: var(--mid-hover); }
.btn-primary { background: var(--dark); color: var(--bg); border-color: var(--dark); }
.btn-primary:hover { background: color-mix(in srgb, var(--dark) 80%, transparent); }
.btn-edit { background: #7A2D3C; color: var(--bg); border-color: #7A2D3C; }
.btn-edit:hover { background: color-mix(in srgb, #7A2D3C 80%, transparent); }

main { display: flex; flex: 1; overflow: hidden; }

/* Calendar panel */
.cal-panel { width: 300px; padding: 24px 20px 20px; background: var(--panel); border-right: 1px solid var(--mid); flex-shrink: 0; display: flex; flex-direction: column; overflow-y: auto; }

.cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.cal-header-labels { display: flex; gap: 4px; align-items: center; }
.cal-header-label { font-size: 13px; font-weight: normal; color: var(--dark); padding: 2px 6px; border-radius: 2px; cursor: pointer; user-select: none; font-family: inherit; transition: background .12s; }
.cal-header-label:hover { background: var(--mid-hover); }
.cal-header-label.active { background: var(--mid); }
.cal-nav { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--mid); width: 24px; line-height: 1; transition: color .12s; }
.cal-nav:hover { color: var(--dark); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.cal-label { text-align: center; font-size: 10px; color: var(--dark); opacity: 0.4; padding: 2px 0 10px; letter-spacing: 0.5px; }
.cal-day { position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--dark); }
.cal-day span { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; z-index: 1; transition: background .12s; font-family: inherit; }
.cal-day:hover:not(.today):not(.selected) span { background: var(--mid-hover); }
.cal-day.other-month { color: var(--mid); }
.cal-day.today span { background: var(--dark); color: var(--bg); font-weight: bold; }
.cal-day.selected:not(.today) span { background: var(--mid); color: var(--dark); }
.cal-icon { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; }
.cal-day.today .cal-icon, .cal-day.selected .cal-icon { opacity: 0.3; }

.cal-picker { display: none; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-top: 4px; }
.cal-pick-item { text-align: center; padding: 9px 4px; border-radius: 2px; cursor: pointer; font-size: 12px; font-family: inherit; color: var(--dark); transition: background .12s; }
.cal-pick-item:hover { background: var(--mid-hover); }
.cal-pick-item.active { background: var(--dark); color: var(--bg); }
.cal-pick-item.this-year { border: 1px solid var(--mid); }

/* Sidebar routines */
.cal-routine-section { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--mid); }
.cal-routine-label { font-size: 10px; color: var(--dark); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px; }
.cal-routine-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--mid-hover); background: none; }
.cal-routine-item input[type=checkbox] { width: 13px; height: 13px; cursor: pointer; accent-color: var(--dark); flex-shrink: 0; }
.cal-routine-item label { flex: 1; font-size: 16px; cursor: pointer; color: var(--dark); line-height: 1.4; font-family: inherit; }
.cal-routine-item.done label { text-decoration: line-through; opacity: 0.4; }

/* Todo panel */
.content-area { flex: 1; overflow: hidden; display: flex; }
#main-view { flex: 1; padding: 32px 40px; overflow-y: auto; }
.todo-date { font-size: 20px; font-weight: normal; color: var(--dark); margin-bottom: 4px; letter-spacing: 0.2px; }
.todo-progress { font-size: 11px; color: var(--dark); opacity: 0.45; margin-bottom: 28px; letter-spacing: 0.5px; }
.add-row { display: flex; gap: 8px; margin-bottom: 28px; border-bottom: 1px solid var(--mid); padding-bottom: 20px; }
.add-row input { flex: 1; padding: 8px 0; border: none; border-bottom: 1px solid var(--mid); background: transparent; font-size: 14px; font-family: inherit; color: var(--dark); transition: border-color .15s; }
.add-row input::placeholder { color: var(--dark); opacity: 0.3; }
.add-row input:focus { outline: none; border-bottom-color: var(--dark); }
.section-label { font-size: 10px; color: var(--dark); opacity: 0.4; text-transform: uppercase; letter-spacing: 1.2px; margin: 24px 0 10px; }
.todo-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--mid-hover); }
.todo-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--dark); flex-shrink: 0; }
.todo-item label { flex: 1; font-size: 14px; cursor: pointer; color: var(--dark); line-height: 1.5; font-family: inherit; }
.todo-item.done { opacity: 0.45; }
.todo-item.done label { text-decoration: line-through; }
.todo-item .del { background: none; border: none; cursor: pointer; color: var(--mid); font-size: 16px; line-height: 1; padding: 0 2px; transition: color .12s; }
.todo-item .del:hover { color: var(--dark); }
.edit-btn { background: none; border: none; cursor: pointer; color: var(--mid); font-size: 13px; line-height: 1; padding: 0 2px; transition: color .12s; }
.edit-btn:hover { color: var(--dark); }
.todo-edit-input { flex: 1; padding: 0; border: none; border-bottom: 1px solid var(--dark); background: transparent; font-size: 14px; font-family: inherit; color: var(--dark); }
.todo-edit-input:focus { outline: none; }

/* Routine management view */
#routine-view { display: none; flex: 1; padding: 32px 40px; overflow-y: auto; }
#routine-view h2 { font-size: 20px; font-weight: normal; color: var(--dark); margin-bottom: 6px; letter-spacing: 0.2px; }
#routine-view p { font-size: 12px; color: var(--dark); opacity: 0.45; margin-bottom: 28px; line-height: 1.7; }

/* Memo view */
#memo-view { display: none; flex: 1; padding: 32px 40px; overflow-y: auto; }
#memo-view h2 { font-size: 20px; font-weight: normal; color: var(--dark); margin-bottom: 6px; letter-spacing: 0.2px; }
#memo-view > p { font-size: 12px; color: var(--dark); opacity: 0.45; margin-bottom: 28px; line-height: 1.7; }
.memo-item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--mid-hover); }
.memo-item-body { flex: 1; }
.memo-item-date { font-size: 10px; color: var(--dark); opacity: 0.4; letter-spacing: 0.4px; margin-bottom: 5px; }
.memo-item-title { font-size: 14px; color: var(--dark); font-weight: bold; margin-bottom: 4px; letter-spacing: 0.2px; }
.memo-edit-title { width: 100%; border: none; border-bottom: 1px solid var(--mid); background: transparent; font-size: 14px; font-family: inherit; color: var(--dark); padding: 4px 0; font-weight: bold; }
.memo-edit-title:focus { outline: none; border-bottom-color: var(--dark); }
.memo-edit-title::placeholder { color: var(--dark); opacity: 0.3; font-weight: normal; }
.memo-item-text { font-size: 13px; color: var(--dark); opacity: 0.75; line-height: 1.7; white-space: pre-wrap; font-family: inherit; }
.memo-item .del { background: none; border: none; cursor: pointer; color: var(--mid); font-size: 16px; line-height: 1; padding: 0 2px; transition: color .12s; flex-shrink: 0; margin-top: 2px; }
.memo-item .del:hover { color: var(--dark); }
.memo-write-area { width: 100%; min-height: 120px; border: none; border-bottom: 1px solid var(--mid); background: transparent; font-size: 14px; font-family: inherit; color: var(--dark); resize: vertical; line-height: 1.8; padding: 8px 0; }
.memo-write-area:focus { outline: none; border-bottom-color: var(--dark); }
.memo-write-area::placeholder { color: var(--dark); opacity: 0.3; }
.cal-day-dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--dark); opacity: 0.5; z-index: 3; }
.today-inline-btn { font-size: 10px; padding: 2px 7px; border: 1px solid var(--mid); background: transparent; border-radius: 3px; cursor: pointer; font-family: inherit; color: var(--dark); transition: background .12s; vertical-align: middle; }
.today-inline-btn:hover { background: var(--mid-hover); }
.routine-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--mid-hover); font-size: 15px; font-family: inherit; color: var(--dark); }
.routine-item .del { background: none; border: none; cursor: pointer; color: var(--mid); font-size: 16px; transition: color .12s; }
.routine-item .del:hover { color: var(--dark); }
.routine-badge { font-size: 10px; color: var(--dark); opacity: 0.45; margin-top: 2px; }
.routine-form-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dark); flex-wrap: wrap; }
.routine-form-label { opacity: 0.6; min-width: 52px; }
.routine-select { border: 1px solid var(--mid); background: transparent; font-size: 12px; font-family: inherit; color: var(--dark); padding: 3px 6px; border-radius: 2px; cursor: pointer; }
.routine-day-label { display: flex; align-items: center; gap: 3px; cursor: pointer; }
.routine-day-num { width: 46px; border: 1px solid var(--mid); background: transparent; font-size: 12px; font-family: inherit; color: var(--dark); padding: 3px 4px; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1 id="header-title">오늘의 할 일</h1>
  <div style="display:flex;gap:8px;">
    <button class="btn" id="memo-btn" onclick="showMemo()">메모</button>
    <button class="btn" id="routine-btn" onclick="showRoutines()">루틴 관리</button>
    <button class="btn" id="back-btn" onclick="showMain()" style="display:none">← 돌아가기</button>
  </div>
</header>

<main>
  <div class="cal-panel">
    <div class="cal-header">
      <button class="cal-nav" onclick="calPrev()">‹</button>
      <div class="cal-header-labels">
        <span class="cal-header-label" id="cal-year-label" onclick="togglePicker('year')"></span>
        <span class="cal-header-label" id="cal-month-label" onclick="togglePicker('month')"></span>
      </div>
      <button class="cal-nav" onclick="calNext()">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-picker" id="cal-picker"></div>
    <div class="cal-routine-section" id="cal-routine-section" style="display:none"></div>
  </div>

  <div class="content-area">
    <div id="main-view">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px;">
        <div class="todo-date" id="todo-date"></div>
        <button class="today-inline-btn" id="today-inline-btn" onclick="goToday()" style="display:none">오늘</button>
      </div>
      <div class="todo-progress" id="todo-progress"></div>
      <div class="add-row">
        <input type="text" id="todo-input" placeholder="할 일 추가..." onkeydown="if(event.key==='Enter'&&!event.isComposing)addTodo()">
        <button class="btn btn-primary" onclick="addTodo()">추가</button>
      </div>
      <div id="todo-list"></div>
    </div>

    <div id="routine-view">
      <h2>루틴 할 일 관리</h2>
      <p>반복 주기를 설정하면 해당 날짜에 자동으로 할 일 목록에 추가됩니다.</p>
      <div class="add-row" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div style="display:flex;gap:8px;">
          <input type="text" id="routine-input" placeholder="루틴 할 일 추가..." onkeydown="if(event.key==='Enter'&&!event.isComposing)addRoutine()">
          <button class="btn btn-primary" id="routine-submit-btn" onclick="addRoutine()">추가</button>
        </div>
        <div class="routine-form-row">
          <span class="routine-form-label">반복 주기</span>
          <select id="routine-repeat" class="routine-select" onchange="updateRepeatUI()">
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
            <option value="monthly">매월</option>
            <option value="yearly">매년</option>
          </select>
          <div id="repeat-weekly" style="display:none;gap:8px;flex-wrap:wrap;align-items:center;">
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="0"> 일</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="1"> 월</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="2"> 화</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="3"> 수</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="4"> 목</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="5"> 금</label>
            <label class="routine-day-label"><input type="checkbox" class="repeat-day-cb" value="6"> 토</label>
            <button type="button" class="btn" style="padding:2px 8px;font-size:11px;" onclick="document.querySelectorAll('.repeat-day-cb').forEach(cb=>cb.checked=false)">초기화</button>
          </div>
          <div id="repeat-monthly" style="display:none;">
            매월 <input type="number" id="routine-day" class="routine-day-num" min="1" max="31" value="1"> 일
          </div>
          <div id="repeat-yearly" style="display:none;">
            매년 <select id="routine-year-month" class="routine-select">
              <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
              <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
              <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
              <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
            </select>
            <input type="number" id="routine-year-day" class="routine-day-num" min="1" max="31" value="1"> 일
          </div>
        </div>
        <div class="routine-form-row">
          <span class="routine-form-label">종료 조건</span>
          <select id="routine-end-type" class="routine-select" onchange="updateEndUI()">
            <option value="none">없음</option>
            <option value="count">횟수</option>
            <option value="date">날짜</option>
          </select>
          <div id="end-count" style="display:none;">
            <input type="number" id="routine-end-count" class="routine-day-num" min="1" value="10" style="width:52px;"> 회
          </div>
          <div id="end-date" style="display:none;">
            <input type="date" id="routine-end-date" class="routine-select">
          </div>
        </div>
        <div class="routine-form-row">
          <span class="routine-form-label">시작 시점</span>
          <select id="routine-start" class="routine-select">
            <option value="this_month">이번 달부터</option>
            <option value="all_past">전체 기간 (이전 날짜 포함)</option>
          </select>
        </div>
      </div>
      <div id="routine-list"></div>
    </div>

    <div id="memo-view">
      <h2>메모</h2>
      <div class="add-row" id="memo-add-row">
        <button class="btn btn-primary" onclick="showMemoForm()">+ 메모 추가</button>
      </div>
      <div id="memo-add-form" class="add-row" style="display:none;flex-direction:column;align-items:stretch;gap:10px;">
        <input type="text" id="memo-title-input" placeholder="제목 (미입력 시 자동 생성)">
        <textarea class="memo-write-area" id="memo-textarea" placeholder="메모를 작성하세요..."></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn" onclick="cancelMemoAdd()">취소</button>
          <button class="btn btn-primary" onclick="addMemo()">저장</button>
        </div>
      </div>
      <div id="memo-list"></div>
    </div>
  </div>
</main>

<script>
// ── 이미지 경로 설정 ──────────────────────────────────────
// 진행률 30% 이하 (이미지 3개 중 랜덤)
const IMG_LOW  = ['images/low_1.png',  'images/low_2.png',  'images/low_3.png'];
// 진행률 30% 초과 ~ 70% 이하
const IMG_MID  = ['images/mid_1.png',  'images/mid_2.png',  'images/mid_3.png'];
// 진행률 70% 초과
const IMG_HIGH = ['images/high_1.png', 'images/high_2.png', 'images/high_3.png', 'images/high_4.png'];
// ─────────────────────────────────────────────────────────

function tierImage(dateStr, todos) {
  if (!todos?.length) return null;
  const pct = todos.filter(t => t.done).length / todos.length * 100;
  const pool = pct <= 30 ? IMG_LOW : pct <= 70 ? IMG_MID : IMG_HIGH;
  // 날짜 기반 결정적 선택 (같은 날짜는 항상 같은 이미지)
  const idx = dateStr.replace(/-/g, '').split('').reduce((a, c) => a + +c, 0) % pool.length;
  return pool[idx];
}

const pad = n => String(n).padStart(2, '0');
const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = dateStr(new Date());

let selectedDate = TODAY;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calMode = 'day'; // 'day' | 'month' | 'year'
let calYearBase = Math.floor(new Date().getFullYear() / 16) * 16;
let editingTodoIdx = null;
let editingRoutineIdx = null;
let editingMemoIdx = null;

const NS = 'paper-todo:';
const load = (k, def) => { try { return JSON.parse(localStorage.getItem(NS + k)) ?? def; } catch { return def; } };
const save = (k, v) => localStorage.setItem(NS + k, JSON.stringify(v));

// 생성일 기준 "주기 수"를 셈 — 매주는 주 단위, 매월은 월 단위, 매년은 년 단위
function cycleCount(r, toDate) {
  const created = r.createdAt ?? '0000-00-00';
  if (created > toDate) return 0;
  const from = new Date(created + 'T00:00:00');
  const to = new Date(toDate + 'T00:00:00');
  if (!r.repeat || r.repeat === 'daily') {
    return Math.floor((to - from) / 86400000) + 1;
  }
  if (r.repeat === 'weekly') {
    const days = r.days ?? [];
    if (!days.length) return 0;
    // 생성일 이후 처음 등장하는 선택 요일의 주(週)를 기준으로 몇 번째 주인지 셈
    const weeks = new Set();
    let cur = new Date(from);
    while (cur <= to) {
      if (days.includes(cur.getDay())) {
        const sun = new Date(cur);
        sun.setDate(cur.getDate() - cur.getDay()); // 해당 주의 일요일
        weeks.add(sun.toISOString().slice(0, 10));
      }
      cur.setDate(cur.getDate() + 1);
    }
    return weeks.size;
  }
  if (r.repeat === 'monthly') {
    const day = r.day ?? 1;
    let count = 0, cur = new Date(from.getFullYear(), from.getMonth(), 1);
    while (cur <= to) {
      const occ = new Date(cur.getFullYear(), cur.getMonth(), day);
      if (occ >= from && occ <= to) count++;
      cur.setMonth(cur.getMonth() + 1);
    }
    return count;
  }
  if (r.repeat === 'yearly') {
    const mo = (r.yearMonth ?? 1) - 1, day = r.yearDay ?? 1;
    let count = 0;
    for (let y = from.getFullYear(); y <= to.getFullYear(); y++) {
      const occ = new Date(y, mo, day);
      if (occ >= from && occ <= to) count++;
    }
    return count;
  }
  return 0;
}

function routineApplies(r, date) {
  const created = r.createdAt ?? '0000-00-00';
  if (r.startFrom === 'all_past') {
    // no date restriction
  } else if (r.startFrom === 'this_month') {
    if (date < created) return false;
  } else {
    if (created > date) return false; // legacy behavior
  }
  const d = new Date(date + 'T00:00:00');
  let matches = false;
  if (!r.repeat || r.repeat === 'daily') matches = true;
  else if (r.repeat === 'weekly') matches = (r.days ?? []).includes(d.getDay());
  else if (r.repeat === 'monthly') matches = d.getDate() === (r.day ?? 1);
  else if (r.repeat === 'yearly') matches = d.getMonth() + 1 === (r.yearMonth ?? 1) && d.getDate() === (r.yearDay ?? 1);
  if (!matches) return false;
  if (r.endType === 'date' && r.endDate && date > r.endDate) return false;
  if (r.endType === 'count' && r.endCount) {
    if (cycleCount(r, date) > r.endCount) return false;
  }
  return true;
}

function repeatLabel(r) {
  const DAYS = ['일','월','화','수','목','금','토'];
  if (!r.repeat || r.repeat === 'daily') return '매일';
  if (r.repeat === 'weekly') return '매주 ' + (r.days ?? []).map(d => DAYS[d]).join('·');
  if (r.repeat === 'monthly') return `매월 ${r.day}일`;
  if (r.repeat === 'yearly') return `매년 ${r.yearMonth}월 ${r.yearDay}일`;
  return '';
}

function getTodos(date) {
  const all = load('todos', {});
  if (!all[date]) {
    all[date] = load('routines', [])
      .filter(r => routineApplies(r, date))
      .map(r => ({ text: r.text ?? r, done: false, routine: true }));
    save('todos', all);
  }
  return all[date];
}

function saveTodos(date, todos) {
  const all = load('todos', {});
  all[date] = todos;
  save('todos', all);
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function renderTodos() {
  const todos = getTodos(selectedDate);
  const d = new Date(selectedDate + 'T00:00:00');
  document.getElementById('todo-date').textContent =
    d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  document.getElementById('today-inline-btn').style.display = selectedDate !== TODAY ? '' : 'none';

  const done = todos.filter(t => t.done).length;
  const total = todos.length;
  document.getElementById('todo-progress').textContent =
    total ? `${done} / ${total} 완료 · ${Math.round(done/total*100)}%` : '';

  let routineHtml = '', customHtml = '';
  todos.forEach((t, i) => {
    if (t.routine) {
      routineHtml += `<div class="cal-routine-item${t.done?' done':''}">
        <input type="checkbox" id="c${i}" ${t.done?'checked':''} onchange="toggle(${i})">
        <label for="c${i}">${esc(t.text)}</label>
      </div>`;
    } else if (editingTodoIdx === i) {
      customHtml += `<div class="todo-item">
        <input type="checkbox" id="c${i}" ${t.done?'checked':''} onchange="toggle(${i})">
        <input type="text" class="todo-edit-input" id="todo-edit-${i}" value="${esc(t.text)}"
          onkeydown="if(event.key==='Enter'&&!event.isComposing)saveTodoEdit(${i});else if(event.key==='Escape')cancelTodoEdit()"
          onblur="saveTodoEdit(${i})">
        <button class="btn" style="padding:2px 8px;font-size:11px;flex-shrink:0;" onmousedown="saveTodoEdit(${i})">완료</button>
      </div>`;
    } else {
      customHtml += `<div class="todo-item${t.done?' done':''}">
        <input type="checkbox" id="c${i}" ${t.done?'checked':''} onchange="toggle(${i})">
        <label for="c${i}">${esc(t.text)}</label>
        <button class="edit-btn" onclick="startTodoEdit(${i})">✎</button>
        <button class="del" onclick="del(${i})">×</button>
      </div>`;
    }
  });

  const routineSection = document.getElementById('cal-routine-section');
  if (routineHtml) {
    routineSection.style.display = '';
    routineSection.innerHTML = `<div class="cal-routine-label">📌 루틴</div>${routineHtml}`;
  } else {
    routineSection.style.display = 'none';
  }

  document.getElementById('todo-list').innerHTML = customHtml;
  renderCal();
}

function addTodo() {
  const inp = document.getElementById('todo-input');
  const text = inp.value.trim();
  if (!text) return;
  const todos = getTodos(selectedDate);
  todos.push({ text, done: false, routine: false });
  saveTodos(selectedDate, todos);
  inp.value = '';
  renderTodos();
}

function toggle(i) {
  const todos = getTodos(selectedDate);
  todos[i].done = !todos[i].done;
  saveTodos(selectedDate, todos);
  renderTodos();
}

function del(i) {
  const todos = getTodos(selectedDate);
  todos.splice(i, 1);
  saveTodos(selectedDate, todos);
  renderTodos();
}

function startTodoEdit(i) {
  editingTodoIdx = i;
  renderTodos();
  setTimeout(() => document.getElementById(`todo-edit-${i}`)?.focus(), 0);
}

function saveTodoEdit(i) {
  if (editingTodoIdx !== i) return;
  const inp = document.getElementById(`todo-edit-${i}`);
  if (!inp) return;
  const text = inp.value.trim();
  if (text) {
    const todos = getTodos(selectedDate);
    todos[i].text = text;
    saveTodos(selectedDate, todos);
  }
  editingTodoIdx = null;
  renderTodos();
}

function cancelTodoEdit() {
  editingTodoIdx = null;
  renderTodos();
}

function renderRoutines() {
  const routines = load('routines', []);
  document.getElementById('routine-list').innerHTML = routines.map((r, i) => {
    let badge = repeatLabel(r) + ' · ' + (r.startFrom === 'all_past' ? '전체 기간' : '이번 달부터');
    if (r.endType === 'count') badge += ` · ${r.endCount}회`;
    else if (r.endType === 'date' && r.endDate) badge += ` · ~${r.endDate}`;
    return `<div class="routine-item">
      <div><div>${esc(r.text ?? r)}</div><div class="routine-badge">${badge}</div></div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="edit-btn" onclick="startRoutineEdit(${i})">✎</button>
        <button class="del" onclick="delRoutine(${i})">×</button>
      </div>
    </div>`;
  }).join('') || '<p style="color:#9ca3af;font-size:13px;">아직 루틴이 없습니다.</p>';
}

function addRoutine() {
  const inp = document.getElementById('routine-input');
  const text = inp.value.trim();
  if (!text) return;
  const repeat = document.getElementById('routine-repeat').value;
  const startFrom = document.getElementById('routine-start').value;
  const endType = document.getElementById('routine-end-type').value;
  let days = [], day = 1, yearMonth = 1, yearDay = 1, endCount = null, endDate = null;
  if (repeat === 'weekly') {
    days = [...document.querySelectorAll('.repeat-day-cb:checked')].map(cb => +cb.value);
    if (!days.length) { alert('요일을 선택해주세요.'); return; }
  }
  if (repeat === 'monthly') day = +document.getElementById('routine-day').value;
  if (repeat === 'yearly') {
    yearMonth = +document.getElementById('routine-year-month').value;
    yearDay = +document.getElementById('routine-year-day').value;
  }
  if (endType === 'count') endCount = +document.getElementById('routine-end-count').value;
  if (endType === 'date') { endDate = document.getElementById('routine-end-date').value; if (!endDate) { alert('종료 날짜를 선택해주세요.'); return; } }

  const routines = load('routines', []);
  const all = load('todos', {});

  if (editingRoutineIdx !== null) {
    const oldText = routines[editingRoutineIdx].text ?? routines[editingRoutineIdx];
    const routine = { text, repeat, days, day, yearMonth, yearDay, startFrom, endType, endCount, endDate, createdAt: routines[editingRoutineIdx].createdAt ?? TODAY };
    routines[editingRoutineIdx] = routine;
    save('routines', routines);
    for (const date in all) {
      all[date] = all[date].filter(t => !(t.routine && t.text === oldText));
      if (routineApplies(routine, date)) all[date].push({ text, done: false, routine: true });
    }
    editingRoutineIdx = null;
    const sb = document.getElementById('routine-submit-btn');
    sb.textContent = '추가';
    sb.classList.replace('btn-edit', 'btn-primary');
  } else {
    const routine = { text, repeat, days, day, yearMonth, yearDay, startFrom, endType, endCount, endDate, createdAt: TODAY };
    routines.push(routine);
    save('routines', routines);
    for (const date in all) {
      if (!routineApplies(routine, date)) continue;
      if (!all[date].some(t => t.routine && t.text === text))
        all[date].push({ text, done: false, routine: true });
    }
  }
  save('todos', all);

  inp.value = '';
  renderRoutines();
  renderTodos();
}

function startRoutineEdit(i) {
  editingRoutineIdx = i;
  const r = load('routines', [])[i];
  document.getElementById('routine-input').value = r.text ?? r;
  document.getElementById('routine-repeat').value = r.repeat ?? 'daily';
  document.getElementById('routine-start').value = r.startFrom ?? 'this_month';
  document.getElementById('routine-end-type').value = r.endType ?? 'none';
  document.getElementById('routine-end-count').value = r.endCount ?? 10;
  document.getElementById('routine-end-date').value = r.endDate ?? '';
  document.getElementById('routine-day').value = r.day ?? 1;
  document.getElementById('routine-year-month').value = r.yearMonth ?? 1;
  document.getElementById('routine-year-day').value = r.yearDay ?? 1;
  document.querySelectorAll('.repeat-day-cb').forEach(cb => { cb.checked = (r.days ?? []).includes(+cb.value); });
  updateRepeatUI();
  updateEndUI();
  const submitBtn = document.getElementById('routine-submit-btn');
  submitBtn.textContent = '수정';
  submitBtn.classList.replace('btn-primary', 'btn-edit');
  document.getElementById('routine-view').scrollTop = 0;
  document.getElementById('routine-input').focus();
}

function updateRepeatUI() {
  const v = document.getElementById('routine-repeat').value;
  document.getElementById('repeat-weekly').style.display = v === 'weekly' ? 'flex' : 'none';
  document.getElementById('repeat-monthly').style.display = v === 'monthly' ? '' : 'none';
  document.getElementById('repeat-yearly').style.display = v === 'yearly' ? '' : 'none';
}

function updateEndUI() {
  const v = document.getElementById('routine-end-type').value;
  document.getElementById('end-count').style.display = v === 'count' ? '' : 'none';
  document.getElementById('end-date').style.display = v === 'date' ? '' : 'none';
}

function delRoutine(i) {
  if (editingRoutineIdx === i) resetRoutineForm();
  else if (editingRoutineIdx > i) editingRoutineIdx--;
  const routines = load('routines', []);
  const deletedText = routines[i].text ?? routines[i];
  routines.splice(i, 1);
  save('routines', routines);
  const all = load('todos', {});
  for (const date in all) {
    all[date] = all[date].filter(t => !(t.routine && t.text === deletedText));
  }
  save('todos', all);
  renderRoutines();
  renderTodos();
}

function resetRoutineForm() {
  editingRoutineIdx = null;
  const submitBtn = document.getElementById('routine-submit-btn');
  submitBtn.textContent = '추가';
  submitBtn.classList.replace('btn-edit', 'btn-primary');
  document.getElementById('routine-input').value = '';
  document.getElementById('routine-repeat').value = 'daily';
  document.getElementById('routine-start').value = 'this_month';
  document.getElementById('routine-end-type').value = 'none';
  document.getElementById('routine-end-count').value = 10;
  document.getElementById('routine-end-date').value = '';
  document.getElementById('routine-day').value = 1;
  document.getElementById('routine-year-month').value = 1;
  document.getElementById('routine-year-day').value = 1;
  document.querySelectorAll('.repeat-day-cb').forEach(cb => cb.checked = false);
  updateRepeatUI();
  updateEndUI();
}

function showRoutines() {
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('routine-view').style.display = 'block';
  document.getElementById('memo-view').style.display = 'none';
  document.getElementById('routine-btn').style.display = 'none';
  document.getElementById('memo-btn').style.display = 'none';
  document.getElementById('back-btn').style.display = '';
  document.getElementById('header-title').textContent = '루틴 관리';
  resetRoutineForm();
  renderRoutines();
}

function showMemo() {
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('routine-view').style.display = 'none';
  document.getElementById('memo-view').style.display = 'block';
  document.getElementById('routine-btn').style.display = 'none';
  document.getElementById('memo-btn').style.display = 'none';
  document.getElementById('back-btn').style.display = '';
  document.getElementById('header-title').textContent = '메모';
  renderMemo();
  cancelMemoAdd();
}

function getMemos() {
  const m = load('memos', []);
  return Array.isArray(m) ? m : [];
}

function renderMemo() {
  const memos = getMemos();
  document.getElementById('memo-list').innerHTML = memos.map((m, i) => {
    const d = new Date((m.createdAt ?? TODAY) + 'T00:00:00');
    const dateLabel = d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
    if (editingMemoIdx === i) {
      return `<div class="memo-item" style="flex-direction:column;align-items:stretch;gap:10px;">
        <input type="text" class="memo-edit-title" id="memo-edit-title-${i}" value="${esc(m.title ?? '')}" placeholder="제목">
        <textarea class="memo-write-area" id="memo-edit-text-${i}">${esc(m.text)}</textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn" onmousedown="cancelMemoEdit()">취소</button>
          <button class="btn btn-primary" onmousedown="saveMemoEdit(${i})">저장</button>
        </div>
      </div>`;
    }
    return `<div class="memo-item">
      <div class="memo-item-body">
        <div class="memo-item-date">${dateLabel}</div>
        <div class="memo-item-title">${esc(m.title ?? 'memo')}</div>
        <div class="memo-item-text">${esc(m.text)}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;margin-top:2px;">
        <button class="edit-btn" onclick="startMemoEdit(${i})">✎</button>
        <button class="del" onclick="delMemo(${i})">×</button>
      </div>
    </div>`;
  }).join('') || '<p style="color:#9ca3af;font-size:13px;">아직 메모가 없습니다.</p>';
}

function showMemoForm() {
  document.getElementById('memo-add-row').style.display = 'none';
  document.getElementById('memo-add-form').style.display = 'flex';
  document.getElementById('memo-textarea').focus();
}

function cancelMemoAdd() {
  document.getElementById('memo-add-form').style.display = 'none';
  document.getElementById('memo-add-row').style.display = '';
  document.getElementById('memo-title-input').value = '';
  document.getElementById('memo-textarea').value = '';
}

function addMemo() {
  const ta = document.getElementById('memo-textarea');
  const text = ta.value.trim();
  if (!text) return;
  const rawTitle = document.getElementById('memo-title-input').value.trim();
  let title;
  if (rawTitle) {
    title = rawTitle;
  } else {
    const n = load('memo-counter', 0) + 1;
    save('memo-counter', n);
    title = `memo${n}`;
  }
  const memos = getMemos();
  memos.unshift({ title, text, createdAt: TODAY });
  save('memos', memos);
  cancelMemoAdd();
  renderMemo();
  renderCal();
}

function delMemo(i) {
  if (editingMemoIdx === i) editingMemoIdx = null;
  else if (editingMemoIdx > i) editingMemoIdx--;
  const memos = getMemos();
  if (/^memo\d+$/.test(memos[i]?.title ?? '')) {
    const n = load('memo-counter', 0);
    if (n > 0) save('memo-counter', n - 1);
  }
  memos.splice(i, 1);
  save('memos', memos);
  renderMemo();
  renderCal();
}

function startMemoEdit(i) {
  cancelMemoAdd();
  editingMemoIdx = i;
  renderMemo();
  setTimeout(() => document.getElementById(`memo-edit-title-${i}`)?.focus(), 0);
}

function saveMemoEdit(i) {
  const titleEl = document.getElementById(`memo-edit-title-${i}`);
  const textEl = document.getElementById(`memo-edit-text-${i}`);
  if (!textEl) return;
  const text = textEl.value.trim();
  if (text) {
    const memos = getMemos();
    memos[i].title = titleEl.value.trim() || memos[i].title;
    memos[i].text = text;
    save('memos', memos);
  }
  editingMemoIdx = null;
  renderMemo();
}

function cancelMemoEdit() {
  editingMemoIdx = null;
  renderMemo();
}

function goToday() {
  selectedDate = TODAY;
  calYear = new Date().getFullYear();
  calMonth = new Date().getMonth();
  calMode = 'day';
  showMain();
}

function showMain() {
  document.getElementById('main-view').style.display = '';
  document.getElementById('routine-view').style.display = 'none';
  document.getElementById('memo-view').style.display = 'none';
  document.getElementById('routine-btn').style.display = '';
  document.getElementById('memo-btn').style.display = '';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('header-title').textContent = '오늘의 할 일';
  renderTodos();
}

function renderCal() {
  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const thisYear = new Date().getFullYear();

  document.getElementById('cal-year-label').textContent = `${calYear}년`;
  document.getElementById('cal-month-label').textContent = MONTHS[calMonth];
  document.getElementById('cal-year-label').classList.toggle('active', calMode === 'year');
  document.getElementById('cal-month-label').classList.toggle('active', calMode === 'month');

  const grid = document.getElementById('cal-grid');
  const picker = document.getElementById('cal-picker');

  if (calMode === 'month') {
    grid.style.display = 'none';
    picker.style.display = 'grid';
    picker.innerHTML = MONTHS.map((m, i) =>
      `<div class="cal-pick-item${i === calMonth ? ' active' : ''}" onclick="selectMonth(${i})">${m}</div>`
    ).join('');
    return;
  }

  if (calMode === 'year') {
    grid.style.display = 'none';
    picker.style.display = 'grid';
    let html = '';
    for (let y = calYearBase; y < calYearBase + 16; y++) {
      let cls = 'cal-pick-item';
      if (y === calYear) cls += ' active';
      else if (y === thisYear) cls += ' this-year';
      html += `<div class="${cls}" onclick="selectYear(${y})">${y}</div>`;
    }
    picker.innerHTML = html;
    return;
  }

  grid.style.display = 'grid';
  picker.style.display = 'none';

  const all = load('todos', {});
  const routines = load('routines', []);
  const memoDates = new Set(getMemos().map(m => m.createdAt));
  const first = new Date(calYear, calMonth, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = ['일','월','화','수','목','금','토'].map(d => `<div class="cal-label">${d}</div>`).join('');
  for (let i = startDay - 1; i >= 0; i--)
    html += `<div class="cal-day other-month"><span>${daysInPrev - i}</span></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    let cls = 'cal-day';
    if (ds === TODAY) cls += ' today';
    else if (ds === selectedDate) cls += ' selected';
    const dayTodos = all[ds] ?? routines.filter(r => routineApplies(r, ds)).map(r => ({ done: false }));
    const img = tierImage(ds, dayTodos);
    const icon = img ? `<img class="cal-icon" src="${img}">` : '';
    const dot = memoDates.has(ds) ? '<div class="cal-day-dot"></div>' : '';
    html += `<div class="${cls}" onclick="selectDate('${ds}')"><span>${d}</span>${icon}${dot}</div>`;
  }
  grid.innerHTML = html;
}

function togglePicker(mode) {
  if (calMode === mode) { calMode = 'day'; }
  else {
    calMode = mode;
    if (mode === 'year') calYearBase = Math.floor(calYear / 16) * 16;
  }
  renderCal();
}

function selectMonth(m) { calMonth = m; calMode = 'day'; renderCal(); }
function selectYear(y) { calYear = y; calMode = 'month'; renderCal(); }

function selectDate(d) {
  selectedDate = d;
  calYear = +d.slice(0,4);
  calMonth = +d.slice(5,7) - 1;
  calMode = 'day';
  showMain();
  renderTodos();
}

function calPrev() {
  if (calMode === 'year') { calYearBase -= 16; renderCal(); return; }
  if (calMode === 'month') { calYear--; renderCal(); return; }
  if (--calMonth < 0) { calMonth = 11; calYear--; }
  renderCal();
}
function calNext() {
  if (calMode === 'year') { calYearBase += 16; renderCal(); return; }
  if (calMode === 'month') { calYear++; renderCal(); return; }
  if (++calMonth > 11) { calMonth = 0; calYear++; }
  renderCal();
}

// 기존 키(네임스페이스 없는) 데이터 한 번만 마이그레이션
if (!localStorage.getItem(NS + 'migrated')) {
  ['todos', 'routines'].forEach(k => {
    const old = localStorage.getItem(k);
    if (old && !localStorage.getItem(NS + k)) localStorage.setItem(NS + k, old);
  });
  localStorage.setItem(NS + 'migrated', '1');
}

renderTodos();
</script>
